<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#07060a">
  <title>Galaxia de girasoles 🌻</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="escena" aria-label="Galaxia de girasoles interactiva"></canvas>

  <header class="cabecera" id="cabecera"></header>
  <p class="pista" id="pista">Arrastra para girar · Pellizca para acercar · Toca un planeta</p>
  <button class="sonido" id="sonido" type="button" aria-label="Activar o silenciar música" hidden>♪</button>

  <!-- Pantalla de entrada -->
  <section class="intro" id="intro">
    <div class="intro-caja">
      <p class="intro-sub" id="intro-sub"></p>
      <h1 class="intro-titulo" id="intro-titulo"></h1>
      <button class="btn-oro" id="intro-boton" type="button"></button>
    </div>
  </section>

  <!-- Tarjeta de cada planeta -->
  <div class="modal" id="modal" hidden>
    <div class="modal-fondo" id="modal-fondo"></div>
    <div class="modal-contenido" role="dialog" aria-modal="true" aria-labelledby="m-titulo">
      <article class="tarjeta">
        <div class="flores flores-arriba"></div>
        <div class="papel">
          <div class="polaroids" id="m-fotos"></div>
          <h2 id="m-titulo"></h2>
          <p class="mensaje" id="m-mensaje"></p>
          <p class="destacado" id="m-destacado"></p>
        </div>
        <div class="flores flores-abajo"></div>
      </article>
      <button class="btn-cerrar" id="m-cerrar" type="button">Cerrar</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
